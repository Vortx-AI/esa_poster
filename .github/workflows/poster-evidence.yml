name: Check poster ecosystem evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject stale, unlabelled or unevidenced ecosystem copy
        run: python poster/ecosystem.py
      - name: Exercise evidence-gate negative controls
        run: |
          python -m pip install blake3==1.0.10
          python -m unittest discover -s poster/tests -v
