<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#f7f7f2"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#101010}.m{font-family:monospace;fill:#101010}
.h{font-size:54px;font-weight:700}.s{font-size:25px}.k{font-size:20px;font-weight:700}
.b{fill:#ffffff;stroke:#101010;stroke-width:2}.a{stroke:#125DFF;stroke-width:5;fill:none}
.muted{fill:#555}.blue{fill:#125DFF}
</style>
<text x="70" y="90" class="t h">WHY THE INVARIANT WORKS</text>
<text x="70" y="135" class="t s muted">emem:fact — one observation, one deterministic name, independently checkable</text>

<rect x="70" y="220" width="350" height="210" rx="8" class="b"/>
<text x="95" y="260" class="t k">1  OBSERVATION</text>
<text x="95" y="315" class="m s">O = (a,b,t,v,u,p,s)</text>
<text x="95" y="360" class="t s">place · type · time · value</text>
<text x="95" y="395" class="t s">uncertainty · provenance · signature</text>

<path d="M430 325 H555" class="a"/>
<polygon points="555,325 535,312 535,338" fill="#125DFF"/>

<rect x="575" y="220" width="420" height="210" rx="8" class="b"/>
<text x="600" y="260" class="t k">2  CANONICAL BYTES</text>
<text x="600" y="315" class="m s">CanonicalCBOR(O)</text>
<text x="600" y="365" class="t s">serialization ambiguity removed</text>
<text x="600" y="400" class="t s muted">same observation → same bytes</text>

<path d="M1005 325 H1125" class="a"/>
<polygon points="1125,325 1105,312 1105,338" fill="#125DFF"/>

<rect x="1145" y="220" width="385" height="210" rx="8" class="b"/>
<text x="1170" y="260" class="t k">3  CONTENT ID</text>
<text x="1170" y="315" class="m s">fact_cid = BLAKE3(bytes)</text>
<text x="1170" y="365" class="t s">change one byte → change the name</text>
<text x="1170" y="400" class="t s muted">agreement becomes arithmetic</text>

<rect x="180" y="535" width="1240" height="100" rx="8" fill="#101010"/>
<text x="800" y="597" text-anchor="middle" style="font-family:monospace;font-size:27px;fill:#fff">emem:fact:&lt;cell64&gt;:&lt;fact_cid&gt;</text>

<text x="800" y="705" text-anchor="middle" class="t h">THE TOKEN IS AN ADDRESS, NOT THE PAYLOAD.</text>

<g transform="translate(130,785)">
<text x="0" y="0" class="t k">RECEIVER CHECK</text>
<text x="0" y="48" class="m s">resolve(token) → canonical bytes → re-hash → CID match → verify receipt</text>
<text x="0" y="96" class="t s muted">No need to trust the previous agent's summary, context window, model, or vendor.</text>
</g>

<line x1="70" y1="940" x2="1530" y2="940" stroke="#101010"/>
<text x="70" y="980" class="t s">What this proves: co-reference + byte integrity + provenance binding. It does not prove objective truth.</text>
</svg>